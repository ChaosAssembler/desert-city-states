[package]
name = "dcs-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
dcs-protocol = { path = "../dcs-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
schemars = "1"

[dev-dependencies]
rmcp = { version = "0.16", features = ["client"] }
