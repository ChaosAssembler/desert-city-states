[package]
name = "dcs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure deterministic simulation core for Desert City-States"

[dependencies]
dcs-protocol = { path = "../dcs-protocol" }
serde = { version = "1", features = ["derive"] }
fxhash = "0.2"
thiserror = "1"
# default-features off + only "wyrand": GameState's RNG is always seeded
# (SeededRng::rng() uses WyRand::new_seed, never the entropy-sourcing
# WyRand::new()/Default), so nanorand doesn't need "std" or any entropy
# backend. This also means nanorand never needs the "getrandom" feature,
# which on wasm32 would otherwise pull in wasm-bindgen/js-sys — those
# generate init code this project's no-wasm-bindgen wasm build (see
# .claude/skills/web-deployment) can't satisfy and that crashes at
# startup the moment any dcs-core symbol is linked, even one unrelated
# to RNG (confirmed by bisection: referencing a bare TerrainType variant
# alone reproduced it before this fix).
nanorand = { version = "0.7", default-features = false, features = ["wyrand"] }
postcard = { version = "1", features = ["use-std"] }
bincode = "1"
serde_json = "1"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["json"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "game_benchmarks"
harness = false

