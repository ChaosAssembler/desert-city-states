[package]
name = "dcs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Glue crate wiring core, protocol, and render for Desert City-States"

[dependencies]
clap = { version = "4.6.3", features = ["derive"] }
dcs-core = { path = "../dcs-core" }
dcs-protocol = { path = "../dcs-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "dcs-app"
path = "src/main.rs"
