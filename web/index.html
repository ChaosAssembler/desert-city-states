<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desert City-States</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <link
      data-trunk
      rel="copy-file"
      href="../target/wasm32-unknown-unknown/release/dcs-web.wasm"
    />
    <!--
      Loaded directly from the CDN the official macroquad docs point at,
      with Subresource Integrity pinning it to the exact known-good bytes
      (see .claude/skills/web-deployment for why: 0.4.15/0.4.16's bundled
      copy has an unfixed upstream bug, not-fl3/macroquad#1055). The
      browser refuses to execute the script if the fetched bytes don't
      match the hash, so this can't silently regress if the CDN content
      ever changes — bump the hash deliberately (and re-verify) instead.
    -->
    <script
      src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"
      integrity="sha384-aUkGEq3KNnv2npTG1Sji/0CeEkAYlIxqTWlGhY19vw7XOlWw3bhKD2BiZAdCerrf"
      crossorigin="anonymous"
    ></script>
    <script>
      // Right-click is used in-game (move commands), so suppress the
      // browser's default context menu on the canvas.
      document
        .getElementById("glcanvas")
        .addEventListener("contextmenu", (e) => e.preventDefault());

      // JSON debug/testing bridge into the live GameState (dev-tools Cargo
      // feature only — see crates/dcs-app/src/agent_bridge.rs and
      // dcs-web.rs's agent_ffi module). Reuses the same Request/Response
      // protocol dcs-mcp speaks, so an agent driving this page (e.g. via
      // Playwright) can set up exact game states without simulating
      // clicks. No wasm-bindgen: plain manual buffer passing through wasm
      // linear memory, same mechanism miniquad's own JS glue already uses
      // for input events.
      window.dcsAgent = {
        dispatch(requestObj) {
          const bytes = new TextEncoder().encode(JSON.stringify(requestObj));
          const inPtr = wasm_exports.agent_alloc(bytes.length);
          new Uint8Array(wasm_memory.buffer, inPtr, bytes.length).set(bytes);

          const packed = wasm_exports.agent_dispatch(inPtr, bytes.length);
          const outPtr = Number(packed >> 32n);
          const outLen = Number(packed & 0xffffffffn);
          // Decode into a plain JS string before freeing — the view below
          // is only valid until agent_free runs.
          const text = new TextDecoder().decode(
            new Uint8Array(wasm_memory.buffer, outPtr, outLen),
          );
          wasm_exports.agent_free(outPtr, outLen);

          return JSON.parse(text);
        },
      };

      load("dcs-web.wasm");
    </script>
  </body>
</html>
